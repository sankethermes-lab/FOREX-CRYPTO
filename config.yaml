timeframe: 15m         # 1m 5m 15m 30m 1h 4h 1d
history_bars: 300      # candles pulled per symbol per scan
poll_seconds: 15       # how often `alerts --loop` re-checks every pair

# ---- Strategy -------------------------------------------------------------
# Name must match a strategy registered in tracker/strategies/__init__.py
strategy: volatile_breakout
strategy_params:
  lookback: 20          # candles that form the range being broken
  min_body_mult: 2.0    # breakout candle body must be >= 2x the range's average body
  close_strength: 0.7   # must close in the top 30% (long) / bottom 30% (short) of the candle
  max_range_pips: null  # e.g. 40 = only breakouts of tight ranges; null = any width
  min_candle_pips: 10   # breakout candle must be at least 10 pips high-to-low; null = no minimum
  # Only used by the backtester / trade-tracking mode, not by Telegram alerts:
  target_pips: 30
  stop_pips: 30
  stop_mode: pips       # pips = fixed stop_pips | range = stop at the other side of the range

# ---- Early breakout alerts (what `start_alerts.bat` runs) ----------------
# Alert the moment price LEAVES a quiet range at several times its normal speed.
early_breakout:
  range_minutes: 30         # the consolidation: high/low of the last 30 minutes
  trigger_minutes: 3        # the burst is measured over the last 3 minutes
  min_speed: 5.0            # ...and must be 5x+ this pair's normal 3-minute move
  min_move_pips: 20         # ...and at least 20 pips (keeps dead markets quiet)
  break_buffer: 0.10        # price must clear the range by 10% of its width
  max_box_ratio: 1.5        # skip "ranges" wider than 1.5x a normal 30-min range
  lookback_minutes: 240     # "normal" speed and the trend are measured over 4 hours
  cooldown_minutes: 30      # one alert per pair & direction per 30 minutes
  followup_minutes: 10      # update ~10 min after each alert (0 = off)
  min_grade: A              # A = only the best setups, B = A+B, C = everything
  news: true                # tag alerts with high-impact news on the pair's currencies
  max_data_age_minutes: 5   # skip pairs with no fresh price (market closed)
  # Crypto is much noisier (tested: near coin-flip follow-through), so it gets
  # stricter settings. Delete this block to use the settings above for crypto too.
  crypto:
    min_speed: 8.0
    min_move_pips: 30

# ---- Sudden-move alerts (alerts.mode: sudden_move) ------------------------
# Alert when any pair moves this many pips within the time window.
sudden_move:
  min_pips: 100             # alert on a move of 100+ pips...
  window_minutes: 5         # ...within the last 5 minutes
  cooldown_minutes: 30      # then stay quiet on that pair/direction for 30 min,
                            # unless it moves another min_pips (EXTENDED alert)
  max_data_age_minutes: 15  # ignore pairs with no fresh price (market closed)
# Crypto pips: 1 pip = 0.01% of the price, so 100 pips = a 1% move (same as
# ~100 pips on EURUSD). Set `pip:` on a watchlist entry to use a fixed size.

# ---- Telegram alerts (`python -m tracker alerts`) -------------------------
alerts:
  mode: early_breakout      # early_breakout = range break at high speed (recommended)
                            # sudden_move = N pips fast | breakout = 15m candle breakout
  # the settings below only apply to mode: breakout
  trigger: live             # live = alert the moment a breakout starts (candle still forming)
                            # close = alert only after the breakout candle closes
  followup: true            # after a live alert, report CONFIRMED / FADED when the candle closes
  recheck_candles: 3        # re-check the last 3 closed candles, since GitHub often runs late
  target_pips: [30, 50]     # price levels shown in the alert for your 30-50 pip exit

# ---- Risk -----------------------------------------------------------------
risk:
  account_balance: 10000
  risk_per_trade_pct: 2.0   # % of account lost if a trade hits its stop
  max_open_trades: 10

# ---- Claude review (optional) --------------------------------------------
# When enabled, every NEW signal is sent to Claude for a second opinion.
# Needs ANTHROPIC_API_KEY in the environment (or `ant auth login`).
claude:
  enabled: false
  model: claude-opus-5
  effort: medium
  veto: false           # true = drop signals Claude rates "reject"

# ---- MetaTrader 5 auto-trading (Windows, MT5 desktop open & logged in) ----
# Each early-breakout alert also places a trade on the account MT5 is logged into.
# Refuses REAL accounts unless allow_real_account is true. Test on DEMO first.
mt5:
  enabled: false            # true = place trades (MT5 must be open and logged in)
  lots: 0.01
  stop_loss_pips: 30
  take_profit_pips: 0       # 0 = no fixed target: let winners run with the trailing stop
  trailing:
    enabled: true
    breakeven_after_pips: 15  # at +15 pips, move the stop to entry +2 (the trade can't lose any more)
    breakeven_lock_pips: 2
    trail_after_pips: 20      # beyond +20 pips, the stop follows price...
    trail_distance_pips: 15   # ...15 pips behind, locking in profit as it climbs
  max_open_trades: 3
  max_daily_loss_pct: 5     # no new trades today once equity is 5% below the day's start
  markets: [forex]          # forex pairs + gold; add crypto only if your broker's crypto spread is small
  symbol_suffix: ""         # e.g. ".a" if your broker names pairs EURUSD.a
  symbol_map: {}            # exceptions, e.g. {XAUUSD: GOLD}
  allow_real_account: false # leave false until a demo has been profitable for 50+ trades

# ---- Alerts ---------------------------------------------------------------
notify:
  console: true
  telegram:
    enabled: true           # needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID (in .env or env vars)
