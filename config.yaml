# ---- What to watch -------------------------------------------------------
# market: crypto -> Binance public API (no key needed)
# market: forex  -> Yahoo Finance chart API (no key needed)
# Pip sizes are automatic (0.0001, JPY pairs 0.01, gold 0.1, BTC $1, ETH $0.1 ...).
# Override any symbol with e.g. {symbol: BTCUSDT, market: crypto, pip: 10}
watchlist:
  # All 28 major & cross forex pairs + gold & silver
  - {symbol: EURUSD, market: forex}
  - {symbol: GBPUSD, market: forex}
  - {symbol: USDJPY, market: forex}
  - {symbol: USDCHF, market: forex}
  - {symbol: USDCAD, market: forex}
  - {symbol: AUDUSD, market: forex}
  - {symbol: NZDUSD, market: forex}
  - {symbol: EURGBP, market: forex}
  - {symbol: EURJPY, market: forex}
  - {symbol: EURCHF, market: forex}
  - {symbol: EURCAD, market: forex}
  - {symbol: EURAUD, market: forex}
  - {symbol: EURNZD, market: forex}
  - {symbol: GBPJPY, market: forex}
  - {symbol: GBPCHF, market: forex}
  - {symbol: GBPCAD, market: forex}
  - {symbol: GBPAUD, market: forex}
  - {symbol: GBPNZD, market: forex}
  - {symbol: AUDJPY, market: forex}
  - {symbol: AUDCHF, market: forex}
  - {symbol: AUDCAD, market: forex}
