# TEMPORARY: replays the early-breakout detector on real history. Will be deleted.
name: Feed diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install pandas numpy requests pyyaml
      - name: Tune on last 7 days
        run: python -c "import yaml; from tracker.tune import main; main(yaml.safe_load(open('config.yaml')), 7)"
