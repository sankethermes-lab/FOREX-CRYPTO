# TEMPORARY: checks live price feeds for every pair. Will be deleted.
name: Feed diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install pandas numpy requests pyyaml
      - shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          import time, yaml, pandas as pd
          from tracker.livefeeds import LiveFeeds
          from tracker.pips import pip_size
          cfg = yaml.safe_load(open("config.yaml"))
          for rnd in range(2):
              t = time.time()
              data = LiveFeeds().fetch_all(cfg["watchlist"], minutes=17)
              print(f"round {rnd}: {len(data)}/{len(cfg['watchlist'])} pairs in {time.time()-t:.1f}s")
          now = pd.Timestamp.now(tz="UTC")
          for it in cfg["watchlist"]:
              d = data.get(it["symbol"])
              if d is None:
                  print(f"{it['symbol']:9} MISSING"); continue
              bars, price, stamp = d
              pip = pip_size(it["symbol"], it["market"], it.get("pip"), price=price)
              w = bars[bars.index >= now - pd.Timedelta(minutes=15)]
              up = (price - min(w["low"].min(), price)) / pip
              dn = (max(w["high"].max(), price) - price) / pip
              print(f"{it['symbol']:9} price={price:<12g} age={(now-stamp).total_seconds():5.0f}s bars={len(w):2d} "
                    f"pip={pip:<10.6g} 15m_up={up:6.1f} 15m_down={dn:6.1f}")
          from tracker.spikes import SpikeScanner
          cfg["notify"] = {"console": True}
          print("scan ->", SpikeScanner(cfg, "state").scan())
